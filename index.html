<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelohouse</title>
<meta name="description" content="Gelohouse: Gelo Health, Kontrast and Run &amp; Chill.">
<link rel="canonical" href="https://gelohouse.com/">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Gelohouse">
<meta property="og:description" content="Gelo Health, Kontrast and Run &amp; Chill.">
<meta property="og:url" content="https://gelohouse.com/">
<meta property="og:image" content="https://gelohouse.com/images/gelohouse.png">
<link rel="icon" href="images/favicon.png?v=4">
<link rel="apple-touch-icon" href="images/gelohouse.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400&family=Montserrat:wght@400&display=swap">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Gelohouse",
  "url": "https://gelohouse.com/",
  "logo": "https://gelohouse.com/images/gelohouse.png",
  "brand": [
    { "@type": "Brand", "name": "Gelo Health", "url": "https://gelohealth.com.br/" },
    { "@type": "Brand", "name": "Kontrast", "url": "https://kontrast.com.br/" },
    { "@type": "Brand", "name": "Run & Chill", "url": "https://www.instagram.com/runchill.club/" }
  ]
}
</script>
<style>
  /* The name is set in Alegreya, the logo's typeface; all other text in Montserrat, as on cdaa.com.br.
     The ink colour is sequoiacap.com's. */
  :root {
    --wall: #fff;
    --ink: #1b1917;
    --muted: #8d8c89;
    --work: clamp(120px, min(13vw, calc((100vh - 330px) / 2)), 230px); /* two rows must fit a laptop screen */
    --space: clamp(36px, 9vw, 170px);
    --row: clamp(40px, 4.5vw, 72px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh; /* phones: the height with the browser bars showing, so a page that fits never scrolls */
    display: flex;
    flex-direction: column;
    background: var(--wall);
    color: var(--ink);
    font: 400 13px/1.5 Montserrat, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 56px 24px 0;
    text-align: center;
  }
  .wordmark {
    font-family: Alegreya, Georgia, serif;
    font-weight: 400;
    font-size: clamp(26px, 2.4vw, 34px);
    line-height: 1;
  }
  .wordmark a {
    color: inherit;
    text-decoration: none;
  }

  /* The page is a wall: on desktop the works hang three over two, the lower pair centred, with equal room above and below and wide gaps between them */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .wall {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--row) var(--space);
    max-width: calc(3 * var(--work) + 2 * var(--space));
  }
  .work {
    display: block;
    width: var(--work);
    color: inherit;
    text-decoration: none;
  }
  .building { cursor: default; }
  /* A soft shadow lifts each work off the wall, without a frame */
  .frame {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    border-radius: 5%; /* barely rounded corners */
    box-shadow: 0 1px 2px rgba(27, 25, 23, 0.06), 0 14px 28px -14px rgba(27, 25, 23, 0.28);
    transition: box-shadow 0.35s ease;
  }
  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Year and name hang under the work, like a gallery label */
  .label {
    padding: 10px 1px 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.04em;
    transition: color 0.35s ease;
  }
  /* Linked works lift off the wall on hover and their label darkens; Building works stay still */
  @media (hover: hover) {
    a.work:hover .frame { box-shadow: 0 2px 4px rgba(27, 25, 23, 0.08), 0 22px 40px -16px rgba(27, 25, 23, 0.4); }
    a.work:hover .label { color: var(--ink); }
  }
  .work:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
  .work:focus-visible .label { color: var(--ink); }

  @media (max-width: 900px) {
    .wall { display: grid; grid-template-columns: repeat(3, var(--work)); max-width: none; --work: clamp(110px, 22vw, 170px); --space: clamp(28px, 6vw, 56px); --row: var(--space); }
  }
  @media (max-width: 600px) {
    header { padding: 28px 16px 0; }
    main { padding: 24px 16px 16px; align-items: stretch; }
    .wall { grid-template-columns: repeat(2, var(--work)); --work: 38vw; --space: 9vw; row-gap: 28px; align-content: space-between; } /* last row as low as possible */
  }
  /* Three rows of works must fit the visible height: 234px = header, paddings, labels and row gaps */
  @supports (height: 100svh) {
    @media (max-width: 600px) {
      .wall { --work: min(38vw, calc((100svh - 234px) / 3)); }
    }
  }
</style>
</head>
<body>

<header>
  <h1 class="wordmark"><a href="/">Gelohouse</a></h1>
</header>

<main>
  <div class="wall">
    <div class="work building">
      <div class="frame"><img src="images/building-b.jpg" alt="" width="512" height="512"></div>
      <div class="label">2027 – Building</div>
    </div>
    <div class="work building">
      <div class="frame"><img src="images/building-a.jpg" alt="" width="512" height="512"></div>
      <div class="label">2026 – Building</div>
    </div>
    <a class="work" href="https://www.instagram.com/runchill.club/" target="_blank" rel="noopener">
      <div class="frame"><img src="images/run-chill.jpg?v=2" alt="Run &amp; Chill" width="512" height="512"></div>
      <div class="label">2026 – Run &amp; Chill</div>
    </a>
    <a class="work" href="https://kontrast.com.br/" target="_blank" rel="noopener">
      <div class="frame"><img src="images/kontrast.jpg?v=2" alt="Kontrast" width="565" height="565"></div>
      <div class="label">2025 – Kontrast</div>
    </a>
    <a class="work" href="https://gelohealth.com.br/" target="_blank" rel="noopener">
      <div class="frame"><img src="images/gelo-health.jpg?v=2" alt="Gelo Health" width="512" height="512"></div>
      <div class="label">2023 – Gelo Health</div>
    </a>
  </div>
</main>

</body>
</html>
