<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelohouse</title>
<meta name="description" content="Gelohouse: Gelo Health, Kontrast and Run &amp; Chill.">
<link rel="canonical" href="https://marcvi1a.github.io/gelohouse/">
<meta property="og:type" content="website">
<meta property="og:title" content="Gelohouse">
<meta property="og:description" content="Gelo Health, Kontrast and Run &amp; Chill.">
<meta property="og:url" content="https://marcvi1a.github.io/gelohouse/">
<meta property="og:image" content="https://marcvi1a.github.io/gelohouse/images/gelohouse.png">
<link rel="icon" href="images/gelohouse.png">
<link rel="apple-touch-icon" href="images/gelohouse.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400&display=swap">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Gelohouse",
  "url": "https://marcvi1a.github.io/gelohouse/",
  "logo": "https://marcvi1a.github.io/gelohouse/images/gelohouse.png",
  "brand": [
    { "@type": "Brand", "name": "Gelo Health", "url": "https://gelohealth.com.br/" },
    { "@type": "Brand", "name": "Kontrast", "url": "https://kontrast.com.br/" },
    { "@type": "Brand", "name": "Run & Chill", "url": "https://www.instagram.com/runchill.club/" }
  ]
}
</script>
<style>
  :root {
    --ink: #111;
    --muted: #767676;
    --paper: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 32px 32px;
  }
  .wordmark {
    font-family: Alegreya, Georgia, serif;
    font-weight: 400;
    font-size: clamp(30px, 3.2vw, 46px);
    line-height: 1;
    letter-spacing: 0.005em;
  }

  /* Instagram profile grid: 3px gaps, the founding year shows on hover like the like-count overlay */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .tile {
    display: block;
    color: inherit;
    text-decoration: none;
  }
  .frame {
    position: relative;
    overflow: hidden;
    aspect-ratio: 4 / 5;
  }
  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.15s;
  }
  /* Touch screens have no hover, so the year sits under the image instead */
  .year {
    display: none;
    padding: 10px 16px 14px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (hover: hover) {
    .tile:hover .overlay { opacity: 1; }
  }
  @media (hover: none) {
    .overlay { display: none; }
    .year { display: block; }
  }
  .tile:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .tile:focus-visible .overlay { opacity: 1; }

  footer {
    padding: 28px 32px 40px;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    header { padding: 20px 16px 22px; }
    .grid { grid-template-columns: 1fr; }
    footer { padding: 22px 16px 32px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="wordmark">Gelohouse</h1>
</header>

<main class="grid">
  <a class="tile" href="https://gelohealth.com.br/" target="_blank" rel="noopener">
    <div class="frame"><img src="images/gelo-health.jpg" alt="Gelo Health" width="512" height="640"><span class="overlay">2023</span></div>
    <div class="year">2023</div>
  </a>
  <a class="tile" href="https://kontrast.com.br/" target="_blank" rel="noopener">
    <div class="frame"><img src="images/kontrast.jpg" alt="Kontrast" width="512" height="640"><span class="overlay">2025</span></div>
    <div class="year">2025</div>
  </a>
  <a class="tile" href="https://www.instagram.com/runchill.club/" target="_blank" rel="noopener">
    <div class="frame"><img src="images/run-chill.jpg" alt="Run &amp; Chill" width="512" height="640"><span class="overlay">2026</span></div>
    <div class="year">2026</div>
  </a>
</main>

<footer>© 2026 Gelohouse</footer>

</body>
</html>
