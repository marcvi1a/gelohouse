<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelohouse</title>
<meta name="description" content="Gelohouse: Gelo Health, Kontrast and Run &amp; Chill.">
<link rel="canonical" href="https://gelohouse.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Gelohouse">
<meta property="og:description" content="Gelo Health, Kontrast and Run &amp; Chill.">
<meta property="og:url" content="https://gelohouse.com/">
<meta property="og:image" content="https://gelohouse.com/images/gelohouse.png">
<link rel="icon" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/gelohouse.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&family=Archivo:wght@600&display=swap">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Gelohouse",
  "url": "https://gelohouse.com/",
  "logo": "https://gelohouse.com/images/gelohouse.png",
  "brand": [
    { "@type": "Brand", "name": "Gelo Health", "url": "https://gelohealth.com.br/" },
    { "@type": "Brand", "name": "Kontrast", "url": "https://kontrast.com.br/" },
    { "@type": "Brand", "name": "Run & Chill", "url": "https://www.instagram.com/runchill.club/" }
  ]
}
</script>
<style>
  /* Fonts follow cdaa.com.br: Archivo for the name, Montserrat for text */
  :root {
    --ink: #171a1c;
    --muted: #7a7d80;
    --paper: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 400 13px/1.5 Montserrat, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 56px 24px 0;
    text-align: center;
  }
  .wordmark {
    font-family: Archivo, sans-serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-right: -0.32em; /* tracking adds space after the last letter; this keeps the word optically centred */
  }

  /* A quiet row of small squares with room around it; year and name show at the bottom on hover */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 56px 112px;
  }
  .grid {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .tile {
    display: block;
    color: inherit;
    text-decoration: none;
  }
  .building { cursor: default; }
  .frame {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
  }
  /* Hairline so a white tile still reads as a square on the white page */
  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07);
    pointer-events: none;
  }
  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  /* Touch screens have no hover, so year and name sit under the image instead */
  .year {
    display: none;
    padding: 8px 2px 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  @media (hover: hover) {
    .tile:hover .overlay { opacity: 1; }
  }
  @media (hover: none) {
    .overlay { display: none; }
    .year { display: block; }
  }
  .tile:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .tile:focus-visible .overlay { opacity: 1; }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(3, 1fr); max-width: 720px; }
  }
  @media (max-width: 640px) {
    header { padding: 40px 16px 0; }
    main { padding: 40px 16px 64px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px 8px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="wordmark">Gelohouse</h1>
</header>

<main>
  <div class="grid">
    <div class="tile building">
      <div class="frame"><img src="images/building-b.jpg" alt="" width="512" height="512"><span class="overlay">2026 – Building</span></div>
      <div class="year">2026 – Building</div>
    </div>
    <div class="tile building">
      <div class="frame"><img src="images/building-a.jpg" alt="" width="512" height="512"><span class="overlay">2026 – Building</span></div>
      <div class="year">2026 – Building</div>
    </div>
    <a class="tile" href="https://www.instagram.com/runchill.club/" target="_blank" rel="noopener">
      <div class="frame"><img src="images/run-chill.jpg?v=2" alt="Run &amp; Chill" width="512" height="512"><span class="overlay">2026 – Run &amp; Chill</span></div>
      <div class="year">2026 – Run &amp; Chill</div>
    </a>
    <a class="tile" href="https://kontrast.com.br/" target="_blank" rel="noopener">
      <div class="frame"><img src="images/kontrast.jpg?v=2" alt="Kontrast" width="565" height="565"><span class="overlay">2025 – Kontrast</span></div>
      <div class="year">2025 – Kontrast</div>
    </a>
    <a class="tile" href="https://gelohealth.com.br/" target="_blank" rel="noopener">
      <div class="frame"><img src="images/gelo-health.jpg?v=2" alt="Gelo Health" width="512" height="512"><span class="overlay">2023 – Gelo Health</span></div>
      <div class="year">2023 – Gelo Health</div>
    </a>
  </div>
</main>

</body>
</html>
